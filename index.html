<script>
    // 1. 자동 언어 감지 및 설정
    const urlParams = new URLSearchParams(window.location.search);
    let lang = urlParams.get("lang") || navigator.language.split('-')[0] || "ko";
    const supportedLangs = ['ko', 'en', 'ja', 'es'];
    if (!supportedLangs.includes(lang)) lang = 'en';

    // 2. 국가별 복권 규칙 및 텍스트 데이터
    const i18n = {
      ko: {
        lottoName: "동행복권 6/45",
        popTitle: "도파민 탈출까지 10초",
        popDesc: "쇼츠, 릴스, 틱톡에 절여진 뇌를 씻어내는 중..<br>지금 이 10초가 당신의 오늘을 바꿉니다.",
        popBack: "↩ 인내 포기하고 도파민의 세계로 돌아가기",
        desc: "쇼츠, 릴스, 틱톡의 도파민에 절여진 당신..<br>탈출할 기회와 행운을 동시에 드립니다.",
        share: "📱 행운 공유하기",
        promo: "앱 출시 사전예약 신청",
        back: "뒤로",
        coffee: "커피 후원",
        mission: "오늘의 미션: ",
        copied: "행운이 클립보드에 복사되었습니다!",
        rules: { count: 6, max: 45, special: false }
      },
      en: {
        lottoName: "Powerball Numbers",
        popTitle: "10s to Escape Dopamine",
        popDesc: "Refreshing your brain from Shorts and Reels..<br>These 10 seconds will change your day.",
        popBack: "↩ Back to Dopamine World",
        desc: "Escape the dopamine loop.<br>Reclaim your time and find your luck.",
        share: "📱 Share Luck",
        promo: "Pre-register Now",
        back: "Back",
        coffee: "Buy Coffee",
        mission: "Today's Mission: ",
        copied: "Luck copied to clipboard!",
        rules: { count: 5, max: 69, special: 26 } // 파워볼 규칙
      },
      ja: {
        lottoName: "ロト6 (LOTO 6)",
        popTitle: "ドパミン脱出까지 10秒",
        popDesc: "ショートやリールに疲れた脳を洗浄中..<br>이 10초가 당신의 하루를 바꿉니다.",
        popBack: "↩ 忍耐を諦めて戻る",
        desc: "ドパミン中毒から脱出しましょう。<br>あなたの貴重な時間を守ってください。",
        share: "📱 幸運を共有する",
        promo: "アプリ事前予約",
        back: "戻る",
        coffee: "コーヒー",
        mission: "今日のミッション: ",
        copied: "コピー完了！",
        rules: { count: 6, max: 43, special: false }
      },
      es: {
        lottoName: "El Gordo de la Primitiva",
        popTitle: "10s para escapar de la dopamina",
        popDesc: "Refrescando tu cerebro de Shorts y Reels..<br>Estos 10 segundos cambiarán tu día.",
        popBack: "↩ Volver a los Shorts",
        desc: "Escapa del bucle de dopamina.<br>Recupera tu tiempo y encuentra tu suerte.",
        share: "📱 Compartir suerte",
        promo: "Pre-registro",
        back: "Volver",
        coffee: "Donar café",
        mission: "Misión de hoy: ",
        copied: "¡Copiado al portapapeles!",
        rules: { count: 5, max: 54, special: 9 }
      }
    };

    const cur = i18n[lang];

    // 텍스트 초기화
    document.getElementById('pop-title').innerText = cur.popTitle;
    document.getElementById('pop-desc').innerHTML = cur.popDesc;
    document.getElementById('pop-back').innerText = cur.popBack;
    document.getElementById('lbl-desc').innerHTML = cur.desc;
    document.getElementById('btn-share').innerText = cur.share;
    document.getElementById('btn-promo').innerText = cur.promo;
    document.getElementById('lbl-back').innerText = cur.back;
    document.getElementById('lbl-coffee').innerText = cur.coffee;

    // --- 🎲 국가별 번호 생성 로직 ---
    function generateNumbers() {
      const { count, max, special } = cur.rules;
      let result = [];
      while(result.length < count) {
        let r = Math.floor(Math.random() * max) + 1;
        if(!result.includes(r)) result.push(r);
      }
      result.sort((a,b) => a-b);
      if(special) result.push(Math.floor(Math.random() * special) + 1); // 보너스 번호
      return result;
    }

    // --- 🕒 10분 쿨타임 및 시퀀스 ---
    const COOLDOWN_TIME = 10 * 60 * 1000;
    let lastVisit = localStorage.getItem('pause_last_visit_time') || 0;
    let isCooldown = (Date.now() - lastVisit) < COOLDOWN_TIME;

    if (isCooldown) {
      document.getElementById('overlay').style.display = 'none';
      startSequence(0);
    } else {
      localStorage.setItem('pause_last_visit_time', Date.now());
      let count = 10;
      const timer = setInterval(() => {
        count--;
        document.getElementById('countdown-num').innerText = count;
        if (count <= 0) {
          clearInterval(timer);
          document.getElementById('overlay').style.display = 'none';
          startSequence(1000);
        }
      }, 1000);
    }

    let currentNums = [];
    function startSequence(delay) {
      currentNums = generateNumbers();
      const container = document.getElementById('ball-container');
      // 복권 이름 표시 (추가됨)
      const nameTag = document.createElement('p');
      nameTag.style.color = "var(--gold)";
      nameTag.style.fontWeight = "bold";
      nameTag.innerText = `[ ${cur.lottoName} ]`;
      container.before(nameTag);

      setTimeout(() => {
        currentNums.forEach((n, i) => {
          setTimeout(() => {
            const ball = document.createElement('div');
            ball.className = 'ball';
            // 마지막 번호가 특수 번호면 색깔 다르게 (파워볼 등)
            if(cur.rules.special && i === currentNums.length - 1) ball.style.borderColor = "var(--accent)";
            ball.innerText = n;
            container.appendChild(ball);
            setTimeout(() => ball.classList.add('show'), 10);
            if(i === currentNums.length - 1) {
              confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
              showFortune();
            }
          }, i * 300);
        });
      }, delay);
    }

    function shareLuck() {
      const msg = `[Pause10] ${cur.lottoName}: ${currentNums.join(", ")}\n${cur.mission}\nhttps://biniare-del.github.io/pause10?lang=${lang}`;
      navigator.clipboard.writeText(msg).then(() => alert(cur.copied));
    }

    // [기존 showFortune, completeMission 등 유지]
</script>
