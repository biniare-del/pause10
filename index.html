<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pause10 - Reclaim Your Time</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    :root { --gold: #fbbf24; --bg: #0b0f1a; --card: #161e2d; --text: #f8fafc; --accent: #10b981; }
    body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; padding: 10px; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    .container { max-width: 400px; width: 100%; }
    .card { background: var(--card); padding: 25px 20px; border-radius: 35px; border: 2px solid transparent; background-image: linear-gradient(var(--card), var(--card)), radial-gradient(circle at top left, var(--gold), #78350f); background-origin: border-box; background-clip: content-box, border-box; box-shadow: 0 20px 40px rgba(0,0,0,0.6); position: relative; }
    h1 { color: var(--gold); font-size: 24px; font-weight: 900; margin: 0 0 15px; letter-spacing: -1px; }
    .stats-row { display: flex; justify-content: space-around; margin-bottom: 20px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 15px; border: 1px solid rgba(251, 191, 36, 0.1); }
    .stat-item span { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 2px; }
    .stat-item strong { font-size: 14px; color: var(--gold); }
    .ball-container { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
    .ball { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; background: #0f172a; border: 1.5px solid rgba(251, 191, 36, 0.4); color: var(--gold); font-size: 16px; opacity: 0; transform: scale(0.5); transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .ball.show { opacity: 1; transform: scale(1); }
    .content-box { display: none; animation: fadeInUp 0.6s ease-out; }
    #fortune-box { margin-top: 15px; padding: 15px; border-radius: 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(251, 191, 36, 0.2); }
    .talisman-icon { font-size: 36px; margin-bottom: 5px; filter: drop-shadow(0 0 8px var(--gold)); }
    #fortune-msg { font-size: 14px; line-height: 1.5; margin: 5px 0 12px; color: #fff; font-weight: 600; }
    #mission-box { margin-top: 12px; padding: 12px; background: rgba(16, 185, 129, 0.05); border-radius: 15px; border: 1px dashed var(--accent); }
    #mission-txt { font-size: 13px; margin: 0 0 8px; color: #e2e8f0; }
    .btn { width: 100%; padding: 14px; border-radius: 15px; font-weight: 800; border: none; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .btn-gold { background: linear-gradient(145deg, var(--gold), var(--gold-dark)); color: #000; margin-top: 15px; text-decoration: none; display: block; }
    .btn-green { background: var(--accent); color: #fff; padding: 10px; }
    .btn-outline { background: none; border: 1px solid #334155; color: #64748b; font-size: 12px; padding: 8px; }
    .footer-links { margin-top: 15px; display: flex; gap: 15px; justify-content: center; }
    .footer-links a { text-decoration: none; color: #4b5563; font-size: 12px; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 id="main-title">PAUSE 10</h1>
      <div class="stats-row">
        <div class="stat-item"><span id="lbl-rank">RANK</span><strong id="grade-txt">-</strong></div>
        <div class="stat-item"><span id="lbl-reclaimed">RECLAIMED</span><strong id="time-txt">00:00:00</strong></div>
      </div>
      <div class="ball-container" id="ball-container"></div>
      <div id="fortune-box" class="content-box">
        <div class="talisman-icon" id="talisman-icon">🔮</div>
        <p id="fortune-msg"></p>
        <button id="btn-share" class="btn btn-green" onclick="shareLuck()"></button>
      </div>
      <div id="mission-box" class="content-box">
        <p id="mission-txt"></p>
        <button id="btn-mission" class="btn btn-outline" onclick="completeMission()"></button>
      </div>
      <div style="margin-top: 15px;">
        <a id="btn-promo" href="https://docs.google.com/forms/d/e/1FAIpQLSchezD_hdqkjGXVTCqM8JaL02IEP8fAoK9GJ57FnB54L5Ql4Q/viewform?usp=header" target="_blank" class="btn btn-gold"></a>
      </div>
      <div class="footer-links">
        <a href="javascript:history.back()">↩ Back</a>
        <a href="https://www.buymeacoffee.com/pause10" target="_blank">☕ Coffee</a>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const lang = (urlParams.get("lang") || "ko").toLowerCase();

    // 1. 번역 텍스트 완벽 분리
    const i18n = {
      ko: { rank: "등급", reclaimed: "되찾은 시간", share: "📱 행운 공유하기", mission: "🎯 미션", missionBtn: "미션 완료!", promo: "사전예약 신청", grades: ["인내의 초보", "시간 관리자", "도파민 헌터", "자유인", "파우즈 마스터"], alertMission: "경험치 상승!", alertCopy: "복사 완료!" },
      en: { rank: "RANK", reclaimed: "RECLAIMED", share: "📱 Share Luck", mission: "🎯 Mission", missionBtn: "Mission Done!", promo: "Pre-register Now", grades: ["Novice Pauser", "Time Manager", "Dopamine Hunter", "Free Spirit", "Pause Master"], alertMission: "Exp Up!", alertCopy: "Copied!" },
      ja: { rank: "ランク", reclaimed: "節約した時間", share: "📱 幸運을シェア", mission: "🎯 ミッション", missionBtn: "ミッション完了！", promo: "事前予約する", grades: ["忍耐の初心者", "時間管理者", "ハンター", "自由人", "マスター"], alertMission: "経験値アップ！", alertCopy: "コピー完了！" }
    };
    const cur = i18n[lang] || i18n.ko;

    // 초기 UI 텍스트 설정
    document.getElementById('lbl-rank').innerText = cur.rank;
    document.getElementById('lbl-reclaimed').innerText = cur.reclaimed;
    document.getElementById('btn-share').innerText = cur.share;
    document.getElementById('btn-mission').innerText = cur.missionBtn;
    document.getElementById('btn-promo').innerText = cur.promo;

    // 30개 행운 데이터 (번역 포함)
    const fortuneData = [
      { icon: "🍀", ko: "3시 이후 서쪽에서 귀인을 만날 운입니다.", en: "A helpful person will appear from the west after 3 PM.", ja: "午後3時以降、西から貴인이現れる運勢です。", mi: { ko: "물 한 잔 마시고 심호흡 하기", en: "Drink water and take a deep breath.", ja: "水を一杯飲み、深呼吸する" } },
      { icon: "💰", ko: "멈춘 10초가 오늘의 금전운을 부릅니다.", en: "The 10s you paused brings financial luck today.", ja: "立ち止まった10秒が今日の金運을呼び寄せます。", mi: { ko: "가장 소중한 사람에게 연락하기", en: "Contact your loved one.", ja: "大切な人に連絡する" } }
    ];
    while(fortuneData.length < 30) { fortuneData.push(fortuneData[fortuneData.length % 2]); }

    let count = parseInt(localStorage.getItem('pause_total_count') || 0);
    
    function initStats() {
      const idx = Math.min(Math.floor(count / 5), 4);
      document.getElementById('grade-txt').innerText = cur.grades[idx]; // 등급 다국어 적용
      let totalSec = count * 10;
      let m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      let s = String(totalSec % 60).padStart(2, '0');
      document.getElementById('time-txt').innerText = `00:${m}:${s}`;
    }

    const nums = [];
    while(nums.length < 6) { let r = Math.floor(Math.random() * 45) + 1; if(!nums.includes(r)) nums.push(r); }
    nums.sort((a,b) => a-b);

    const container = document.getElementById('ball-container');
    nums.forEach((n, i) => {
      setTimeout(() => {
        const ball = document.createElement('div');
        ball.className = 'ball'; ball.innerText = n;
        container.appendChild(ball);
        setTimeout(() => ball.classList.add('show'), 10);
        if(i === 5) {
          confetti({ particleCount: 100, spread: 60, origin: { y: 0.7 }, colors: ['#fbbf24', '#ffffff'] });
          setTimeout(showFortune, 500);
        }
      }, i * 200);
    });

    function showFortune() {
      const luck = fortuneData[Math.floor(Math.random() * fortuneData.length)];
      document.querySelectorAll('.content-box').forEach(el => el.style.display = 'block');
      document.getElementById('talisman-icon').innerText = luck.icon;
      document.getElementById('fortune-msg').innerText = luck[lang] || luck.ko;
      document.getElementById('mission-txt').innerText = `${cur.mission}: ${luck.mi[lang] || luck.mi.ko}`; // 미션 다국어 적용
      count++;
      localStorage.setItem('pause_total_count', count);
      initStats();
    }

    function completeMission() { alert(cur.alertMission); }
    function shareLuck() { 
      const msg = `[Pause10] Luck Numbers: ${nums.join(", ")}\nLuck: ${document.getElementById('fortune-msg').innerText}\nbiniare-del.github.io/pause10`;
      navigator.clipboard.writeText(msg).then(() => alert(cur.alertCopy)); 
    }
    initStats();
  </script>
</body>
</html>
