<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pause10 - Stop Before Shorts</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    :root { --gold: #fbbf24; --bg: #0b0f1a; --card: #161e2d; --text: #f8fafc; --accent: #10b981; --sub: #94a3b8; }
    body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; box-sizing: border-box; }
    .container { max-width: 600px; width: 100%; }
    
    .card { background: var(--card); padding: 45px 30px; border-radius: 40px; border: 1.5px solid rgba(251, 191, 36, 0.2); position: relative; text-align: center; }
    
    /* 🎖️ 상단 배지 (복구) */
    .header-badges { position: absolute; top: 20px; left: 30px; right: 30px; display: flex; justify-content: space-between; align-items: center; }
    .lv-badge { background: var(--gold); color: #000; padding: 4px 12px; border-radius: 10px; font-weight: 900; font-size: 13px; letter-spacing: -0.5px; }
    .live-badge { background: rgba(16, 185, 129, 0.1); color: var(--accent); padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }

    /* ⏱️ 실시간 타이머 (복구) */
    .timer-section { margin: 25px 0 15px; }
    .timer-label { font-size: 13px; color: var(--sub); margin-bottom: 8px; font-weight: 500; }
    .timer-value { font-size: 38px; font-weight: 900; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: 1px; }

    h1 { color: var(--gold); font-size: 34px; font-weight: 900; margin: 15px 0 10px; }
    .desc { font-size: 15px; line-height: 1.7; color: var(--sub); margin-bottom: 30px; word-break: keep-all; }

    .ball-container { display: flex; gap: 10px; justify-content: center; margin: 25px 0; flex-wrap: wrap; min-height: 50px; }
    .ball { width: 50px; height: 50px; border-radius: 14px; background: rgba(251, 191, 36, 0.05); border: 2px solid var(--gold); color: var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; opacity: 0; transform: translateY(10px); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .ball.show { opacity: 1; transform: translateY(0); }

    #fortune-box { display: none; margin-top: 25px; padding: 30px; border-radius: 35px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(251, 191, 36, 0.15); animation: fadeIn 0.8s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #mission-txt { color: var(--accent); font-weight: 700; font-size: 16px; margin: 12px 0 25px; display: block; }

    .btn { width: 100%; padding: 20px; border-radius: 20px; font-weight: 800; border: none; cursor: pointer; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn-gold { background: var(--gold); color: #000; margin: 25px 0; }
    .btn-green { background: var(--accent); color: #fff; margin-bottom: 15px; }
    
    .footer-btns { display: flex; gap: 12px; margin-top: 25px; }
    .btn-footer { flex: 1; background: rgba(255,255,255,0.06); color: var(--sub); font-size: 13px; padding: 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; }

    #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }
    .pop-card { border: 2.5px solid var(--gold); border-radius: 45px; padding: 45px; background: #000; width: 90%; max-width: 440px; box-shadow: 0 0 40px rgba(251, 191, 36, 0.15); }
  </style>
</head>
<body>

  <div id="overlay">
    <div class="pop-card">
      <h2 id="pop-title" style="color:var(--gold); margin-bottom:15px; font-size:26px;"></h2>
      <p id="pop-desc" style="color:#ccc; line-height:1.7; margin-bottom:25px; font-size:16px;"></p>
      <div id="countdown-num" style="font-size:90px; font-weight:900; color:var(--gold); margin:25px 0;">10</div>
      <button id="pop-back" onclick="history.back()" style="background:none; border:none; color:var(--sub); text-decoration:underline; cursor:pointer; font-size:15px;"></button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div class="header-badges">
        <div class="lv-badge">LV.1</div>
        <div class="live-badge"><div class="dot"></div><span id="live-count">24</span> LIVE</div>
      </div>

      <h1 style="margin-top:20px;">PAUSE 10</h1>
      
      <div class="timer-section">
        <p class="timer-label" id="lbl-reclaimed"></p>
        <div class="timer-value" id="time-txt">00:00:00</div>
      </div>

      <p id="lbl-desc" class="desc"></p>

      <div id="ball-area">
         <span id="lotto-name" style="color:var(--gold); font-weight:700; font-size:15px; display:block; margin-bottom:12px;"></span>
         <div id="ball-container" class="ball-container"></div>
      </div>
      
      <div id="fortune-box">
        <div style="font-size:45px; margin-bottom:12px;">🔮</div>
        <p id="fortune-msg" style="font-weight:800; font-size:19px;"></p>
        <span id="mission-txt"></span>
        <button id="btn-share" class="btn btn-green" onclick="shareLuck()"></button>
      </div>

      <a id="btn-promo" href="https://forms.gle/..." target="_blank" class="btn btn-gold"></a>

      <div class="footer-btns">
        <a href="javascript:history.back()" class="btn-footer" id="lbl-back"></a>
        <a href="https://www.buymeacoffee.com/pause10" target="_blank" class="btn-footer">☕ <span id="lbl-coffee"></span></a>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let lang = urlParams.get("lang") || navigator.language.split('-')[0] || "ko";
    const i18n = {
      ko: {
        popTitle: "도파민 탈출까지 10초",
        popDesc: "쇼츠, 릴스, 틱톡에 절여진 뇌를 씻어내는 중..<br>지금 이 10초가 당신의 오늘을 바꿉니다.",
        popBack: "↩ 그냥 쇼츠 보러 가기",
        reclaimed: "내가 되찾은 소중한 시간",
        desc: "쇼츠, 릴스, 틱톡의 도파민에 절여진 당신..<br>탈출할 기회와 행운을 동시에 드립니다.",
        lottoName: "동행복권 6/45",
        share: "📱 행운 공유하기",
        promo: "앱 출시 사전예약 신청",
        back: "뒤로",
        coffee: "커피 후원",
        missionHead: "오늘의 미션: ",
        copied: "행운이 복사되었습니다!",
        rules: { count: 6, max: 45, special: false },
        fortunes: [
          { m: "인내는 쓰고 열매는 답니다.", i: "물 한 잔 마시기" },
          { m: "멈춘 10초가 행운을 부릅니다.", i: "심호흡 3번 하기" }
        ]
      },
      en: {
        popTitle: "10s to Escape Dopamine",
        popDesc: "Refreshing your brain from dopamine loops..<br>These 10 seconds will change your day.",
        popBack: "↩ Back to Shorts",
        reclaimed: "Time Reclaimed",
        desc: "Escape the dopamine loop.<br>Reclaim your time and find your luck.",
        lottoName: "Powerball Numbers",
        share: "📱 Share Luck",
        promo: "Pre-register Now",
        back: "Back",
        coffee: "Buy Coffee",
        missionHead: "Today's Mission: ",
        copied: "Luck copied!",
        rules: { count: 5, max: 69, special: 26 },
        fortunes: [
          { m: "Patience is bitter, but its fruit is sweet.", i: "Drink water" }
        ]
      }
    };

    const cur = i18n[lang] || i18n.en;

    // 초기 텍스트 반영
    document.getElementById('pop-title').innerText = cur.popTitle;
    document.getElementById('pop-desc').innerHTML = cur.popDesc;
    document.getElementById('pop-back').innerText = cur.popBack;
    document.getElementById('lbl-reclaimed').innerText = cur.reclaimed;
    document.getElementById('lbl-desc').innerHTML = cur.desc;
    document.getElementById('lotto-name').innerText = `[ ${cur.lottoName} ]`;
    document.getElementById('btn-share').innerText = cur.share;
    document.getElementById('btn-promo').innerText = cur.promo;
    document.getElementById('lbl-back').innerText = cur.back;
    document.getElementById('lbl-coffee').innerText = cur.coffee;

    // 실시간 타이머 복구
    function tick() {
      const now = new Date();
      document.getElementById('time-txt').innerText = 
        now.getHours().toString().padStart(2, '0') + ":" + 
        now.getMinutes().toString().padStart(2, '0') + ":" + 
        now.getSeconds().toString().padStart(2, '0');
    }
    setInterval(tick, 1000); tick();

    // 10분 쿨타임 로직 (10초 대기)
    const COOLDOWN = 10 * 60 * 1000;
    const last = localStorage.getItem('pause_last_visit_time') || 0;
    if (Date.now() - last < COOLDOWN) {
      document.getElementById('overlay').style.display = 'none';
      start();
    } else {
      localStorage.setItem('pause_last_visit_time', Date.now());
      let c = 10;
      const t = setInterval(() => {
        c--; document.getElementById('countdown-num').innerText = c;
        if(c <= 0) { clearInterval(t); document.getElementById('overlay').style.display = 'none'; start(); }
      }, 1000);
    }

    let finalNums = [];
    function start() {
      const r = cur.rules;
      while(finalNums.length < r.count) {
        let n = Math.floor(Math.random() * r.max) + 1;
        if(!finalNums.includes(n)) finalNums.push(n);
      }
      finalNums.sort((a,b)=>a-b);
      if(r.special) finalNums.push(Math.floor(Math.random() * r.special) + 1);

      const container = document.getElementById('ball-container');
      finalNums.forEach((n, i) => {
        setTimeout(() => {
          const ball = document.createElement('div');
          ball.className = 'ball';
          if(r.special && i === finalNums.length - 1) ball.style.borderColor = "var(--accent)";
          ball.innerText = n;
          container.appendChild(ball);
          setTimeout(() => ball.classList.add('show'), 10);
          if(i === finalNums.length - 1) finish();
        }, i * 300);
      });
    }

    function finish() {
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      const luck = cur.fortunes[Math.floor(Math.random() * cur.fortunes.length)];
      document.getElementById('fortune-box').style.display = 'block';
      document.getElementById('fortune-msg').innerText = luck.m;
      document.getElementById('mission-txt').innerText = cur.missionHead + luck.i;
    }

    function shareLuck() {
      const msg = `[Pause10] ${cur.reclaimed}: ${document.getElementById('time-txt').innerText}\n${cur.lottoName}: ${finalNums.join(", ")}\nhttps://biniare-del.github.io/pause10?lang=${lang}`;
      navigator.clipboard.writeText(msg).then(() => alert(cur.copied));
    }

    setInterval(() => {
      document.getElementById('live-count').innerText = Math.floor(Math.random() * 20) + 15;
    }, 4000);
  </script>
</body>
</html>
