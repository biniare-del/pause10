<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pause10 - Reclaim Your Time</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    /* [기존 스타일 유지] */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    :root { --gold: #fbbf24; --gold-dark: #d97706; --bg: #0b0f1a; --card: #161e2d; --text: #f8fafc; --accent: #10b981; --sub: #94a3b8; }
    body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 600px; width: 100%; }
    .card { background: var(--card); padding: 40px 30px; border-radius: 40px; border: 0.5px solid rgba(251, 191, 36, 0.3); position: relative; }
    
    /* 🌑 검은색 팝업창(Overlay) 스타일 */
    #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }
    #overlay h2 { color: var(--gold); font-size: 28px; margin-bottom: 10px; }
    #overlay p { color: #ccc; line-height: 1.6; margin-bottom: 30px; }
    #countdown-num { font-size: 100px; font-weight: 900; color: var(--gold); margin-bottom: 40px; }
    .back-link { color: var(--sub); text-decoration: underline; font-size: 14px; cursor: pointer; }

    /* [결과창 스타일] */
    .ball-container { display: flex; gap: 10px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
    .ball { width: 50px; height: 50px; border-radius: 12px; background: rgba(251, 191, 36, 0.1); border: 1px solid var(--gold); color: var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 800; opacity: 0; transform: scale(0.5); transition: 0.5s; }
    .ball.show { opacity: 1; transform: scale(1); }
    #fortune-box { display: none; margin-top: 20px; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 20px; text-align: center; }
    .btn { width: 100%; padding: 15px; border-radius: 15px; font-weight: 700; border: none; cursor: pointer; margin-top: 10px; display: block; text-decoration: none; text-align: center; }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-green { background: var(--accent); color: #fff; }
  </style>
</head>
<body>

  <div id="overlay">
    <h2 id="pop-title"></h2>
    <p id="pop-desc"></p>
    <div id="countdown-num">10</div>
    <div class="back-link" id="pop-back" onclick="history.back()"></div>
  </div>

  <div class="container">
    <div class="card">
      <h1 style="color:var(--gold)">PAUSE 10</h1>
      <p id="lbl-desc" style="color:var(--sub); line-height:1.6;"></p>
      
      <div id="ball-container" class="ball-container"></div>
      
      <div id="fortune-box">
        <div id="talisman-icon" style="font-size: 40px;">🔮</div>
        <p id="fortune-msg" style="font-weight:bold;"></p>
        <p id="mission-txt" style="color:var(--accent); margin: 15px 0;"></p>
        <button id="btn-share" class="btn btn-green" onclick="shareLuck()"></button>
      </div>

      <a id="btn-promo" href="#" class="btn btn-gold"></a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const lang = (urlParams.get("lang") || "ko").toLowerCase();

    // 🌐 언어별 데이터 (팝업 문구까지 완벽 추가)
    const i18n = {
      ko: {
        popTitle: "도파민 탈출까지 10초",
        popDesc: "쇼츠, 릴스, 틱톡에 절여진 뇌를 씻어내는 중..<br>지금 이 10초가 당신의 오늘을 바꿉니다.",
        popBack: "↩ 인내 포기하고 쇼츠 보러 가기",
        desc: "도파민에 절여진 당신.. 탈출할 기회와 행운을 동시에 드립니다.",
        share: "📱 행운 공유하기",
        promo: "앱 출시 사전예약 신청",
        mission: "오늘의 미션: ",
        copied: "복사 완료!",
        fortunes: [
          { m: "인내는 쓰고 열매는 답니다.", i: "물 한 잔 마시기" },
          { m: "멈춘 10초가 행운을 부릅니다.", i: "심호흡 3번 하기" }
        ]
      },
      en: {
        popTitle: "10s to Escape Dopamine",
        popDesc: "Refreshing your brain from Shorts and Reels..<br>These 10 seconds will change your day.",
        popBack: "↩ Give up and go back to Shorts",
        desc: "Escape the dopamine loop. Reclaim your time and find your luck.",
        share: "📱 Share Luck",
        promo: "Pre-register Now",
        mission: "Today's Mission: ",
        copied: "Copied!",
        fortunes: [
          { m: "Patience is bitter, but its fruit is sweet.", i: "Drink a glass of water" },
          { m: "This 10s pause brings you luck.", i: "Take 3 deep breaths" }
        ]
      },
      ja: {
        popTitle: "ドパミン脱出まで10秒",
        popDesc: "ショートやリールに疲れた脳を洗浄中..<br>이 10초가 당신의 하루를 바꿉니다.",
        popBack: "↩ 忍耐を諦めて戻る",
        desc: "ドパミン中毒から脱出しましょう。あなたの貴重な時間を守ってください。",
        share: "📱 幸運を共有する",
        promo: "アプリ事前予約",
        mission: "今日のミッション: ",
        copied: "コピー完了！",
        fortunes: [
          { m: "忍耐は苦いが、その実は甘い。", i: "水を一杯飲む" },
          { m: "止まった10秒が幸運を呼びます。", i: "深呼吸を3回する" }
        ]
      }
    };

    const cur = i18n[lang] || i18n.ko;

    // 텍스트 적용
    document.getElementById('pop-title').innerText = cur.popTitle;
    document.getElementById('pop-desc').innerHTML = cur.popDesc;
    document.getElementById('pop-back').innerText = cur.popBack;
    document.getElementById('lbl-desc').innerText = cur.desc;
    document.getElementById('btn-share').innerText = cur.share;
    document.getElementById('btn-promo').innerText = cur.promo;

    // --- 🕒 10분 쿨타임 및 카운트다운 로직 ---
    const COOLDOWN_TIME = 10 * 60 * 1000;
    const lastVisit = localStorage.getItem('pause_last_visit_time') || 0;
    const isCooldown = (Date.now() - lastVisit) < COOLDOWN_TIME;
    
    if (isCooldown) {
      document.getElementById('overlay').style.display = 'none'; // 쿨타임이면 팝업 안 띄움
      startSequence(0);
    } else {
      localStorage.setItem('pause_last_visit_time', Date.now());
      let count = 10;
      const timer = setInterval(() => {
        count--;
        document.getElementById('countdown-num').innerText = count;
        if (count <= 0) {
          clearInterval(timer);
          document.getElementById('overlay').style.opacity = '0';
          setTimeout(() => {
            document.getElementById('overlay').style.display = 'none';
            startSequence(1000);
          }, 500);
        }
      }, 1000);
    }

    function startSequence(delay) {
      const nums = Array.from({length: 6}, () => Math.floor(Math.random() * 45) + 1).sort((a,b)=>a-b);
      const container = document.getElementById('ball-container');
      
      setTimeout(() => {
        nums.forEach((n, i) => {
          setTimeout(() => {
            const ball = document.createElement('div'); ball.className = 'ball'; ball.innerText = n;
            container.appendChild(ball); setTimeout(() => ball.classList.add('show'), 10);
            if(i === 5) {
              confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
              showResult(nums);
            }
          }, i * 300);
        });
      }, delay);
    }

    function showResult(nums) {
      const luck = cur.fortunes[Math.floor(Math.random() * cur.fortunes.length)];
      document.getElementById('fortune-box').style.display = 'block';
      document.getElementById('fortune-msg').innerText = luck.m;
      document.getElementById('mission-txt').innerText = cur.mission + luck.i;
    }

    function shareLuck() {
      const msg = `[Pause10] Luck: ${document.getElementById('fortune-msg').innerText}\nbiniare-del.github.io/pause10?lang=${lang}`;
      navigator.clipboard.writeText(msg).then(() => alert(cur.copied));
    }
  </script>
</body>
</html>
