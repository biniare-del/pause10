<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pause10 - Reclaim Your Time</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    :root { 
      --gold: #fbbf24; --gold-dark: #d97706; --bg: #0b0f1a; --card: #161e2d; 
      --text: #f8fafc; --accent: #10b981; --sub: #94a3b8;
    }
    
    /* 🌓 라이트 모드 대응: 사용자 시스템 설정에 따라 자동 변경 */
    @media (prefers-color-scheme: light) {
      :root { --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --sub: #64748b; }
    }

    body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; 
      margin: 0; padding: 20px; box-sizing: border-box; display: flex; justify-content: center; min-height: 100vh; transition: background 0.3s, color 0.3s; }
    
    .container { max-width: 600px; width: 100%; }
    
    .card { background: var(--card); padding: 40px 30px; border-radius: 40px; 
      border: 1px solid rgba(251, 191, 36, 0.2);
      box-shadow: 0 30px 60px rgba(0,0,0,0.5); position: relative; width: 100%; box-sizing: border-box; overflow: hidden; }

    .live-badge { position: absolute; top: 20px; right: 30px; background: rgba(16, 185, 129, 0.1); color: var(--accent); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px; animation: pulse 2s infinite; }
    .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }

    h1 { color: var(--gold); font-size: 32px; font-weight: 900; margin: 0 0 10px; letter-spacing: -1.5px; }

    .stats-row { display: flex; justify-content: space-between; margin-bottom: 30px; padding: 20px 40px; background: rgba(127,127,127,0.05); border-radius: 25px; border: 1px solid rgba(251, 191, 36, 0.1); }
    .stat-item span { display: block; font-size: 11px; color: var(--sub); text-transform: uppercase; margin-bottom: 5px; }
    .stat-item strong { font-size: 22px; color: var(--gold); font-weight: 800; }

    .ball-container { display: flex; gap: 12px; justify-content: center; margin: 30px 0; flex-wrap: wrap; }
    .ball { width: 55px; height: 55px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 800; background: rgba(15, 23, 42, 0.1); border: 1.5px solid rgba(251, 191, 36, 0.2); color: var(--gold); font-size: 22px; opacity: 0; transform: scale(0.5); transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .ball.show { opacity: 1; transform: scale(1); }

    .content-box { display: none; animation: fadeInUp 0.8s ease-out; }
    #fortune-box { margin-top: 20px; padding: 30px; border-radius: 30px; background: rgba(127, 127, 127, 0.02); border: 1px solid rgba(251, 191, 36, 0.1); }
    .talisman-icon { font-size: 50px; margin-bottom: 15px; }
    #fortune-msg { font-size: 18px; line-height: 1.6; margin-bottom: 20px; font-weight: 600; }

    .btn { width: 100%; padding: 18px; border-radius: 18px; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    .btn-gold { background: linear-gradient(145deg, var(--gold), var(--gold-dark)); color: #000; margin: 30px 0 10px; }
    .btn-green { background: var(--accent); color: #fff; }
    .btn-outline { background: none; border: 1px solid var(--sub); color: var(--sub); font-size: 14px; padding: 10px; margin-top: 10px; }

    .sound-ctrl { position: absolute; top: 20px; left: 30px; background: none; border: none; color: var(--sub); cursor: pointer; font-size: 18px; z-index: 10; }

    .footer-btns { display: flex; gap: 12px; margin-top: 20px; }
    .btn-footer { flex: 1; background: rgba(127,127,127,0.05); color: var(--sub); font-size: 14px; padding: 12px; border-radius: 15px; border: 1px solid rgba(127,127,127,0.1); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; }
    
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body onclick="startBgmOnFirstClick()">
  <div class="container">
    <div class="card">
      <button class="sound-ctrl" onclick="toggleSound(event)" id="sound-btn">🔊</button>
      <div class="live-badge"><div class="dot"></div><span id="live-count">12</span> LIVE</div>
      
      <h1>PAUSE 10</h1>
      <p id="lbl-desc" style="font-size: 14px; color: var(--sub); margin-bottom: 25px;"></p>

      <div class="stats-row">
        <div class="stat-item"><span id="lbl-rank">RANK</span><strong id="grade-txt">-</strong></div>
        <div class="stat-item"><span id="lbl-reclaimed">RECLAIMED</span><strong id="time-txt">00:00:00</strong></div>
      </div>

      <div class="ball-container" id="ball-container"></div>
      
      <div id="fortune-box" class="content-box">
        <div class="talisman-icon" id="talisman-icon">🔮</div>
        <p id="fortune-msg"></p>
        <button id="btn-share" class="btn btn-green" onclick="shareLuck()"></button>
        <button id="btn-mission" class="btn btn-outline" onclick="completeMission()"></button>
      </div>

      <a id="btn-promo" href="https://docs.google.com/forms/..." target="_blank" class="btn btn-gold"></a>
      
      <div class="footer-btns">
        <a href="javascript:history.back()" class="btn-footer">↩ <span id="lbl-back"></span></a>
        <a href="https://www.buymeacoffee.com/pause10" target="_blank" class="btn-footer">☕ <span id="lbl-coffee"></span></a>
      </div>
    </div>
  </div>

  <audio id="bgm" loop autoplay>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
  </audio>
  <script>
  // ... [상단 i18n 및 쿨타임 로직은 동일합니다] ...

function showFortune() {
  // 아이콘, 운세, 미션 세트 데이터
  const fortuneData = [
    { icon: "🍀", ko: "인내는 쓰고 열매는 답니다.", mi: "물 한 잔 마시기" },
    { icon: "💰", ko: "멈춘 10초가 오늘의 금전운을 부릅니다.", mi: "심호흡 3번 하기" },
    { icon: "🧘", ko: "마음의 평온이 가장 큰 자산입니다.", mi: "기지개 크게 켜기" },
    { icon: "☀️", ko: "당신의 밝은 에너지가 행운을 끌어당깁니다.", mi: "거울 보고 미소 짓기" },
    { icon: "💎", ko: "흔들리지 않는 마음이 보석보다 빛납니다.", mi: "눈 10초간 감고 있기" }
  ];

  // 랜덤으로 하나 선택
  const luck = fortuneData[Math.floor(Math.random() * fortuneData.length)];
  
  // 화면에 데이터 뿌리기
  document.getElementById('fortune-box').style.display = 'block';
  document.getElementById('talisman-icon').innerText = luck.icon;
  document.getElementById('fortune-msg').innerText = luck.ko;
  
  // 미션 박스가 있다면 미션 텍스트 넣어주기
  const missionTxt = document.getElementById('mission-txt');
  if (missionTxt) {
    missionTxt.innerText = "🎯 오늘의 미션: " + luck.mi;
    document.getElementById('mission-box').style.display = 'block';
  }
}

// ... [이하 생략] ...
  </script>
</body>
</html>
