<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pause10 - Reclaim Your Time</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3563/3563395.png">
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    :root { 
      --gold: #fbbf24; --gold-dark: #d97706; --bg: #0b0f1a; --card: #161e2d; 
      --text: #f8fafc; --accent: #10b981; --sub: #94a3b8;
    }
    
    @media (prefers-color-scheme: light) {
      :root { --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --sub: #64748b; }
    }

    body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; 
      margin: 0; padding: 20px; box-sizing: border-box; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; }
    
    .container { max-width: 600px; width: 100%; }
    
    .card { background: var(--card); padding: 40px 30px; border-radius: 40px; 
      border: 0.5px solid rgba(251, 191, 36, 0.3);
      box-shadow: 0 30px 60px rgba(0,0,0,0.5); position: relative; width: 100%; box-sizing: border-box; overflow: hidden; }

    .live-badge { position: absolute; top: 20px; right: 30px; background: rgba(16, 185, 129, 0.1); color: var(--accent); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px; animation: pulse 2s infinite; }
    .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }

    h1 { color: var(--gold); font-size: 32px; font-weight: 900; margin: 0 0 10px; letter-spacing: -1.5px; }
    .desc { font-size: 15px; line-height: 1.6; color: var(--sub); margin-bottom: 25px; }

    .stats-row { display: flex; justify-content: space-between; margin-bottom: 30px; padding: 20px 40px; background: rgba(127,127,127,0.05); border-radius: 25px; border: 1px solid rgba(251, 191, 36, 0.1); }
    .stat-item span { display: block; font-size: 11px; color: var(--sub); text-transform: uppercase; margin-bottom: 5px; }
    .stat-item strong { font-size: 22px; color: var(--gold); font-weight: 800; }

    .ball-container { display: flex; gap: 12px; justify-content: center; margin: 30px 0; flex-wrap: wrap; }
    .ball { width: 55px; height: 55px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 800; background: rgba(15, 23, 42, 0.1); border: 1.5px solid rgba(251, 191, 36, 0.2); color: var(--gold); font-size: 22px; opacity: 0; transform: scale(0.5); transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .ball.show { opacity: 1; transform: scale(1); }

    .content-box { display: none; animation: fadeInUp 0.8s ease-out; }
    #fortune-box { margin-top: 20px; padding: 30px; border-radius: 30px; background: rgba(127, 127, 127, 0.02); border: 1px solid rgba(251, 191, 36, 0.1); text-align: center; }
    .talisman-icon { font-size: 50px; margin-bottom: 15px; }
    #fortune-msg { font-size: 18px; line-height: 1.6; margin-bottom: 20px; font-weight: 600; }

    .btn { width: 100%; padding: 18px; border-radius: 18px; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    .btn-gold { background: linear-gradient(145deg, var(--gold), var(--gold-dark)); color: #000; margin: 30px 0 10px; }
    .btn-green { background: var(--accent); color: #fff; margin-bottom: 15px; }
    .btn-outline { background: none; border: 1px solid var(--sub); color: var(--sub); font-size: 14px; padding: 10px; }

    #mission-box { margin-top: 20px; padding: 20px; background: rgba(16, 185, 129, 0.05); border-radius: 20px; border: 1px dashed var(--accent); display: none; }
    #mission-txt { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 12px; }

    .sound-ctrl { position: absolute; top: 20px; left: 30px; background: none; border: none; color: var(--sub); cursor: pointer; font-size: 18px; z-index: 10; }

    .footer-btns { display: flex; gap: 12px; margin-top: 20px; }
    .btn-footer { flex: 1; background: rgba(127,127,127,0.05); color: var(--sub); font-size: 13px; padding: 12px; border-radius: 15px; border: 1px solid rgba(127,127,127,0.1); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
    
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body onclick="startBgmOnFirstClick()">
  <div class="container">
    <div class="card">
      <button class="sound-ctrl" onclick="toggleSound(event)" id="sound-btn">🔊</button>
      <div class="live-badge"><div class="dot"></div><span id="live-count">12</span> LIVE</div>
      
      <h1>PAUSE 10</h1>
      <p id="lbl-desc" class="desc"></p>

      <div class="stats-row">
        <div class="stat-item"><span id="lbl-rank">RANK</span><strong id="grade-txt">-</strong></div>
        <div class="stat-item"><span id="lbl-reclaimed">RECLAIMED</span><strong id="time-txt">00:00:00</strong></div>
      </div>

      <div class="ball-container" id="ball-container"></div>
      
      <div id="fortune-box" class="content-box">
        <div class="talisman-icon" id="talisman-icon">🔮</div>
        <p id="fortune-msg"></p>
        <button id="btn-share" class="btn btn-green" onclick="shareLuck()"></button>
        
        <div id="mission-box">
          <p id="mission-txt"></p>
          <button id="btn-mission" class="btn btn-outline" onclick="completeMission()"></button>
        </div>
      </div>

      <a id="btn-promo" href="https://docs.google.com/forms/..." target="_blank" class="btn btn-gold"></a>
      
      <div class="footer-btns">
        <a href="javascript:history.back()" class="btn-footer" id="lbl-back"></a>
        <a href="https://www.buymeacoffee.com/pause10" target="_blank" class="btn-footer">☕ <span id="lbl-coffee"></span></a>
      </div>
    </div>
  </div>

  <audio id="bgm" loop autoplay>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
  </audio>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const lang = (urlParams.get("lang") || "ko").toLowerCase();

    const i18n = {
      ko: { 
        desc: "쇼츠, 릴스, 틱톡의 도파민에 절여진 당신..<br>탈출할 기회와 행운을 동시에 드립니다.<br>당신의 소중한 시간을 지켜내세요.", 
        rank: "등급", reclaimed: "되찾은 시간", share: "📱 행운 공유하기", missionBtn: "🎯 미션 완료!", promo: "앱 출시 사전예약 신청", grades: ["인내의 초보", "시간 관리자", "도파민 헌터", "자유인", "파우즈 마스터"], 
        back: "↩ 도파민의 세계로 돌아가기",
        coffee: "커피 후원" 
      },
      en: { desc: "Tired of dopamine loops?<br>Escape now and reclaim your time.", rank: "RANK", reclaimed: "RECLAIMED", share: "📱 Share Luck", missionBtn: "🎯 Mission Done!", promo: "Pre-register Now", grades: ["Novice", "Manager", "Hunter", "Free Spirit", "Master"], back: "↩ Back to Shorts", coffee: "Buy Coffee" }
    };
    const cur = i18n[lang] || i18n.ko;

    document.getElementById('lbl-desc').innerHTML = cur.desc;
    document.getElementById('lbl-rank').innerText = cur.rank;
    document.getElementById('lbl-reclaimed').innerText = cur.reclaimed;
    document.getElementById('btn-share').innerText = cur.share;
    document.getElementById('btn-mission').innerText = cur.missionBtn;
    document.getElementById('btn-promo').innerText = cur.promo;
    document.getElementById('lbl-back').innerText = cur.back;
    document.getElementById('lbl-coffee').innerText = cur.coffee;

    const bgm = document.getElementById('bgm');
    bgm.volume = 0.2; 
    function startBgmOnFirstClick() { if(bgm.paused) bgm.play(); }
    function toggleSound(e) {
      e.stopPropagation();
      if(bgm.paused) { bgm.play(); document.getElementById('sound-btn').innerText = "🔊"; }
      else { bgm.pause(); document.getElementById('sound-btn').innerText = "🔇"; }
    }

    const COOLDOWN_TIME = 10 * 60 * 1000; 
    let lastVisit = localStorage.getItem('pause_last_visit_time') || 0;
    let now = Date.now();
    let isCooldown = (now - lastVisit) < COOLDOWN_TIME;
    if (!isCooldown) { localStorage.setItem('pause_last_visit_time', now); }

    let totalSaved = parseInt(localStorage.getItem('pause_total_time') || 0);
    let sessionStart = Date.now();
    function updateLiveTimer() {
      let currentTime = Date.now();
      let sessionElapsed = Math.floor((currentTime - sessionStart) / 1000);
      let displayTime = totalSaved + sessionElapsed;
      document.getElementById('time-txt').innerText = 
        String(Math.floor(displayTime / 3600)).padStart(2, '0') + ":" +
        String(Math.floor((displayTime % 3600) / 60)).padStart(2, '0') + ":" +
        String(displayTime % 60).padStart(2, '0');
      const idx = Math.min(Math.floor(displayTime / 30), 4);
      document.getElementById('grade-txt').innerText = cur.grades[idx];
      localStorage.setItem('pause_total_time', displayTime);
    }
    setInterval(updateLiveTimer, 1000);

    const nums = [];
    while(nums.length < 6) { let r = Math.floor(Math.random() * 45) + 1; if(!nums.includes(r)) nums.push(r); }
    nums.sort((a,b) => a-b);
    const container = document.getElementById('ball-container');
    const waitTime = isCooldown ? 0 : 10000;

    setTimeout(() => {
      nums.forEach((n, i) => {
        setTimeout(() => {
          const ball = document.createElement('div'); ball.className = 'ball'; ball.innerText = n;
          container.appendChild(ball); setTimeout(() => ball.classList.add('show'), 10);
          if(i === 5) { 
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#fbbf24', '#ffffff'] }); 
            showFortune();
          }
        }, i * 250);
      });
    }, waitTime);

    function showFortune() {
      const fortuneData = [
        { icon: "🍀", msg: "인내는 쓰고 열매는 답니다.", mi: "물 한 잔 마시고 오기" },
        { icon: "💰", msg: "멈춘 10초가 오늘의 금전운을 부릅니다.", mi: "심호흡 크게 3번 하기" },
        { icon: "🧘", msg: "마음의 평온이 가장 큰 자산입니다.", mi: "기지개 시원하게 켜기" },
        { icon: "☀️", msg: "당신의 밝은 에너지가 행운을 부릅니다.", mi: "거울 보고 씩 웃어주기" },
        { icon: "💎", msg: "오늘 당신의 선택이 내일의 보석이 됩니다.", mi: "눈 10초 동안 감고 쉬기" }
      ];
      const luck = fortuneData[Math.floor(Math.random() * fortuneData.length)];
      
      document.getElementById('fortune-box').style.display = 'block';
      document.getElementById('talisman-icon').innerText = luck.icon;
      document.getElementById('fortune-msg').innerText = luck.msg;
      
      const mBox = document.getElementById('mission-box');
      const mTxt = document.getElementById('mission-txt');
      if(mTxt) {
          mTxt.innerText = "🎯 오늘의 미션: " + luck.mi;
          mBox.style.display = 'block';
      }
    }

    function completeMission() { alert("미션 완료! 도파민 수치가 정상으로 돌아오고 있습니다."); }
    function shareLuck() { 
      const time = document.getElementById('time-txt').innerText;
      const msg = `[Pause10] Reclaimed Time: ${time}\nLucky: ${nums.join(", ")}\nbiniare-del.github.io/pause10`;
      navigator.clipboard.writeText(msg).then(() => alert("복사 완료!"));
    }

    setInterval(() => {
      const count = Math.floor(Math.random() * (25 - 8) + 8);
      document.getElementById('live-count').innerText = count;
    }, 5000);
  </script>
</body>
</html>
